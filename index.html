<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Valeriia Archakhova" />
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials"
    />
    <meta
      name="description"
      content="This is a flashcards app project which people can use to study software engineering fundamentals "
    />
    <title>Flashcards app: learning materials</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="./assets/vendor/normalize.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">Home</a></li>
          <li><a class="nav__link" href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content page__main-content_location_carousel">
      <section id="home" class="decks">
        <h2 class="decks__title">My Decks</h2>
        <div class="wrapping-row">
          <ul class="decks__list wrapping-row__display-contents">
            <template id="deck-template">
              <li class="deck-card deck_color_green">
                <a class="deck__link" href="#"></a>
                <h3 class="deck__titles">Title</h3>
                <div class="deck__row">
                  <p class="deck__count">cards</p>
                  <button class="deck__delete-btn" type="button">
                    <img
                      class="deck-delete-icon"
                      src="./assets/images/delete.svg"
                      alt="delete deck"
                    />
                  </button>
                </div>
              </li>
            </template>
          </ul>
          <button class="decks__new-deck-btn">+ New Deck</button>
        </div>
      </section>

      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Not Found</p>
      </section>

      <section id="carousel" class="carousel">
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
        <div class="carousel__row">
          <button
            type="button"
            aria-label="Go to previous card in deck"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
          </div>
          <button
            type="button"
            aria-label="Go to next card in deck"
            class="carousel__btn carousel__btn_type_right"
          ></button>
        </div>
        <button
          type="button"
          aria-label="Flip the card"
          class="carousel__btn carousel__btn_type_flip"
        ></button>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">2026 Valeriia Archakhova</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
